name: 🚀 نشر الإنتاج إلى هوستنجر

on:
  push:
    branches: [port-00134]

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: بناء ثم رفع فرع deploy
    runs-on: ubuntu-latest
    steps:
      - name: 📥 استلام الكود
        uses: actions/checkout@v4

      - name: 🟢 إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 📦 تثبيت الاعتماديات
        run: npm ci

      - name: 🔎 فحص بيئة الإنتاج (يمنع نسخة بلا مفتاح إشعارات)
        run: npm run env:check
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_ENV: production
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      - name: 🔨 بناء الموقع
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_ENV: production
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}

      - name: 📤 رفع dist/ إلى فرع deploy (ينشئه إن لم يكن موجودًا)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan deploy
          # git rm -rf . يحذف الملفات **المتتبَّعة** فقط. node_modules/ غير متتبّعة،
          # فتبقى على القرص ثم يضيفها `git add -A -f` قسراً (‎-f يتجاوز .gitignore).
          # النتيجة قبل الإصلاح: فرع deploy بـ45,699 ملف node_modules ونسخة dist/ مكرّرة
          # (‎dist/dist في المسار) — 47,600 ملف لحزمة من 1,901.
          #
          # ⚠ لا نستعمل `git clean` هنا: يمسح dist/ نفسها فلا يبقى ما ننسخه.
          #   ننقل الحزمة أولاً إلى مجلد آمن، ثم نمسح، ثم نعيدها في الجذر.
          mv dist ../dist-keep
          git rm -rf . || true
          git clean -fdxq
          cp -a ../dist-keep/. .
          rm -rf ../dist-keep
          # بلا ‎-f: احترام .gitignore هو المقصود، و`git clean` أزالت ما قد يبقى.
          git add -A
          git commit -m "deploy: نشر الإنتاج"
          git push -f origin deploy
