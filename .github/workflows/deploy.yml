name: 🚀 نشر الإنتاج إلى هوستنجر

# جسر تلقائي: كل مرة تُرفَع كوميت على الفرع port-00134
# → يُبنَى React إلى ملفات ثابتة (dist/) → تُرفَع تلقائياً إلى هوستنجر عبر FTP
# → يظهر التعديل على jazirat-alakarim.com خلال دقيقة.
# يمكن تشغيله يدوياً أيضاً من تبويب Actions → "Deploy to Hostinger".

on:
  push:
    branches: [port-00134]
  workflow_dispatch:

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: بناء ثم نشر
    runs-on: ubuntu-latest
    steps:
      - name: 📥 استلام الكود
        uses: actions/checkout@v4

      - name: 🟢 إعداد Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 📦 تثبيت الاعتماديات
        run: npm ci

      - name: 🔨 بناء الموقع (يحوّل كود React إلى ملفات ثابتة في dist/)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_ENV: production

      - name: 📤 رفع dist/ إلى هوستنجر (FTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./dist/
          server-dir: /
          # يمسح محتوى المجلد الهدف قبل الرفع — يحذف تلقائياً الملفات القديمة الخاطئة
          dangerous-clean-slate: false
          log-level: standard

      - name: ✅ التحقق الحي (معلوماتي فقط — لا يؤثر على نجاح النشر)
        if: success()
        continue-on-error: true
        run: |
          curl -sL https://jazirat-alakarim.com/ -o /tmp/index.html || true
          echo "— نتيجة التحقق من الصفحة —"
          grep -o '<title>[^<]*</title>' /tmp/index.html || echo "(الصفحة لم تُحمّل بعد — انتظر دقيقة وتأكد في المتصفح)"
