name: DB SQL Tests (كل ملفات اختبار SQL)

# F-04: كان يعمل في CI ثلاثة ملفات SQL فقط من أصل 235.
# هذا المسار يشغّل **كل** ما يمكن تشغيله بأمان، ويصنّف الباقي بوضوح بدل تجاهله.
#
#   job: guarded   → الملفات المحصّنة (begin/rollback) — **حاجز للبناء**
#   job: unguarded → الملفات التي تكتب بيانات ثابتة ولا تنظّف — تقرير فقط (لا تُفشل البناء)
#
# التصنيف يقوم به scripts/db-tests.sh --list (مصدر الحقيقة الوحيد).

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'tests/db/**'
      - 'scripts/db-tests.sh'
      - '.github/workflows/db-tests.yml'
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: db-sql-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PGURL: postgresql://postgres:postgres@localhost:54322/postgres
  SUPABASE_START_ARGS: >-
    supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,storage-api,supavisor --debug

jobs:
  guarded:
    name: اختبارات SQL المحصّنة (حاجز)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      - name: بدء Supabase المحلي
        run: |
          set -o pipefail
          $SUPABASE_START_ARGS 2>&1 | tee /tmp/supabase-start.log

      - name: تشخيص فشل بدء Supabase (بيئة الاختبار فقط)
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('/tmp/supabase-start.log')
          text = p.read_text(errors='replace') if p.exists() else 'No startup log was produced.'
          text = re.sub(r'\x1b\[[0-9;]*m', '', text)
          text = re.sub(r'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+', '[REDACTED_JWT]', text)
          text = re.sub(r'(?i)(password|secret|token|api_?key)(\s*[=:]\s*)[^ \n,;]+', r'\1\2[REDACTED]', text)
          text = re.sub(r'postgres(?:ql)?://[^@\s]+@', 'postgresql://[REDACTED]@', text)
          lines = text.splitlines()
          errors = [line for line in lines if re.search(r'error|failed|unhealthy|denied|timeout|manifest|not found|invalid|fatal|panic', line, re.I)]
          summary = '\n'.join((errors[-30:] + ['--- log tail ---'] + lines[-20:]))[-12000:]
          print('::error title=Supabase startup diagnostics::' + summary.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY

      - name: قاعدة فارغة ← كل المهاجرات
        run: supabase db reset --debug

      # اختبارات pgTAP تحتاج الملحق. مثبَّت محلياً فقط (قاعدة مؤقتة) — لا يُثبَّت على الإنتاج.
      - name: تجهيز pgtap (لاختبارات pgTAP)
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -c 'create extension if not exists pgtap;'

      - name: تصنيف ملفات الاختبار (تقرير)
        run: ./scripts/db-tests.sh --list

      - name: تشغيل الاختبارات المحصّنة
        run: ./scripts/db-tests.sh

      - name: إيقاف Supabase
        if: always()
        run: supabase stop --no-backup || true

  unguarded:
    name: اختبارات SQL غير المحصّنة (تقرير — لا تُفشل البناء)
    runs-on: ubuntu-latest
    needs: guarded
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      - name: بدء Supabase المحلي
        run: $SUPABASE_START_ARGS

      - name: قاعدة فارغة ← كل المهاجرات
        run: supabase db reset --debug

      - name: تجهيز pgtap (لاختبارات pgTAP)
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -c 'create extension if not exists pgtap;'

      - name: تشغيل غير المحصّنة (تقرير فقط)
        env:
          DB_TESTS_ALLOW_FAIL: '1'
        run: ./scripts/db-tests.sh --unguarded

      - name: إيقاف Supabase
        if: always()
        run: supabase stop --no-backup || true
