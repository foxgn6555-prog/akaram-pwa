<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- عرض مقفول: لا تكبير/تصغير (متطلب التصميم الثابت) — إمكانية الوصول تُحفَظ عبر التصميم المتجاوب نفسه -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#005f8d" />
    <meta name="description" content="جزيرة الأكرام — النظام الإلكتروني لإدارة شركة البلدية" />

    <!-- ═══ CSP أساسية (تُكمَّل بمطابقة headers على الاستضافة — انظر docs/login-security.md) ═══ -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                   script-src 'self';
                   style-src 'self' 'unsafe-inline';
                   img-src 'self' data: blob:;
                   font-src 'self' data:;
                   connect-src 'self' http://localhost:54321 ws://localhost:54321 https://*.supabase.co wss://*.supabase.co;
                   base-uri 'self';
                   form-action 'self'" />

    <!-- حماية النقر المزيف فعلياً (frame-ancestors لا يعمل في meta) -->
    <script>
      if (window.top !== window.self) {
        window.top.location = window.self.location
      }
    </script>

    <link rel="icon" href="/icons/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>جزيرة الأكرام — تسجيل الدخول</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
