<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>غير متصل — شركة البلدية</title>
    <style>
      body { font-family: 'Segoe UI', system-ui, sans-serif; display: grid; place-items: center;
             min-height: 100vh; margin: 0; background: #f8fafc; color: #0f172a; text-align: center; }
      .box { max-width: 24rem; padding: 2rem; }
      h1 { font-size: 1.25rem; margin-bottom: .5rem; }
      p { color: #64748b; font-size: .875rem; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>تعذّر تحميل التطبيق. تحقق من الشبكة وأعد المحاولة.<br />
      التغييرات التي أجريتها دون اتصال ستُزامن تلقائياً عند عودة الاتصال.</p>
    </div>
  </body>
</html>
